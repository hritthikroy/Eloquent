<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' blob:;">
  <title>Recording</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      -webkit-app-region: drag;
      user-select: none;
      overflow: hidden;
      background: transparent !important;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Pill-shaped overlay with clean rounded corners and no black background artifacts */
    .overlay {
      height: 40px;
      background: #1e293b;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      display: inline-flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    /* Recording indicator - pulsing ring */
    .rec-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      position: relative;
    }

    .rec-ring {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #22c55e;
      position: absolute;
      animation: ringPulse 1.5s ease-in-out infinite;
    }

    .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    .overlay.rewrite .rec-ring {
      border-color: #a855f7;
    }

    .overlay.rewrite .rec-dot {
      background: #a855f7;
    }

    @keyframes ringPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    /* Label text */
    .rec-label {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      white-space: nowrap;
    }

    /* Waveform - sleek modern equalizer */
    .waveform {
      height: 24px;
      width: 76px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #waveCanvas {
      width: 76px;
      height: 24px;
      display: block;
    }

    /* Timer badge */
    .timer {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      font-variant-numeric: tabular-nums;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 8px;
      border-radius: 10px;
      flex-shrink: 0;
      text-align: center;
      min-width: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }



    /* Entrance animation */
    .overlay {
      animation: slideIn 0.2s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Exit animation */
    .overlay.fade-out {
      animation: fadeOut 0.2s ease-out forwards;
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      50% { opacity: 0.7; transform: translateY(-4px) scale(0.98); }
      to { opacity: 0; transform: translateY(-8px) scale(0.95); }
    }

    /* Quick popup mode - faster, more dramatic animations */
    .overlay.quick-popup {
      animation: quickPopIn 0.1s ease-out;
    }

    @keyframes quickPopIn {
      0% { 
        opacity: 0; 
        transform: translateY(-8px) scale(0.8); 
      }
      50% { 
        opacity: 1; 
        transform: translateY(2px) scale(1.05); 
      }
      100% { 
        opacity: 1; 
        transform: translateY(0) scale(1); 
      }
    }

    /* Quick popup flash effect */
    .overlay.quick-popup .rec-indicator {
      animation: quickFlash 0.15s ease-in-out infinite;
    }

    @keyframes quickFlash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Quick popup compact styling */
    .overlay.quick-popup {
      height: 35px;
      padding: 0 12px;
      gap: 8px;
    }

    .overlay.quick-popup .rec-label {
      font-size: 12px;
    }

    .overlay.quick-popup .timer {
      font-size: 11px;
      padding: 1px 6px;
      min-width: 35px;
    }

    .overlay.quick-popup .waveform {
      width: 40px;
      height: 16px;
    }

    /* Error state styling */
    .overlay.error {
      border-color: rgba(239, 68, 68, 0.5);
      background: linear-gradient(135deg, #1e293b 0%, #2d1f1f 100%);
      min-width: 380px;
    }

    .overlay.error .rec-ring {
      border-color: #ef4444;
      animation: none;
    }

    .overlay.error .rec-dot {
      background: #ef4444;
    }

    .overlay.error .rec-label {
      color: #ef4444;
      flex-shrink: 0;
    }

    .overlay.error .timer {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
      min-width: auto;
      max-width: 280px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* Overlay container holding pill and live-text card */
    .overlay-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    /* Live Real-Time Text Card (Like Grammarly) */
    .live-card {
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      padding: 8px 14px;
      max-width: 320px;
      min-width: 200px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: none;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      text-align: left;
    }

    .live-card.visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .live-card-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .live-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #22c55e;
    }

    .overlay.rewrite ~ .live-card .live-badge {
      color: #a855f7;
    }

    .live-text {
      font-size: 13px;
      line-height: 1.4;
      color: #f8fafc;
      word-wrap: break-word;
      font-weight: 400;
    }

    .live-text.polishing {
      color: #38bdf8;
      font-style: italic;
    }
  </style>
</head>

<body>
  <div class="overlay-container">
    <div class="overlay" id="overlay">
      <div class="rec-indicator">
        <div class="rec-ring"></div>
        <div class="rec-dot"></div>
      </div>

      <span class="rec-label">Recording</span>

      <div class="waveform">
        <canvas id="waveCanvas"></canvas>
      </div>

      <div class="timer" id="timer">0:00</div>
    </div>

    <!-- Live Real-Time Text Rendering & Fixing (Like Grammarly) -->
    <div class="live-card" id="liveCard">
      <div class="live-card-header">
        <span class="live-badge" id="liveBadge">✨ Real-time Voice</span>
      </div>
      <div class="live-text" id="liveText">Listening to your voice...</div>
    </div>
  </div>

  <script src="overlay.js"></script>
</body>

</html>
