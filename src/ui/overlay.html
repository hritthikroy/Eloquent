<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';">
  <title>Recording</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      -webkit-app-region: drag;
      user-select: none;
      overflow: hidden;
      background: transparent;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* PERFORMANCE BOOST: Hardware acceleration */
      transform: translateZ(0);
      backface-visibility: hidden;
      will-change: transform;
      /* PERFORMANCE BOOST: Disable text rendering optimizations for speed */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeSpeed;
    }

    /* ULTRA-FAST Pill-shaped overlay with hardware acceleration */
    .overlay {
      height: 40px;
      background: #1e293b;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      display: inline-flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
      /* PERFORMANCE BOOST: Hardware acceleration and compositing */
      transform: translateZ(0);
      backface-visibility: hidden;
      will-change: transform, opacity;
      /* PERFORMANCE BOOST: Force GPU layer */
      -webkit-transform: translateZ(0);
      -webkit-backface-visibility: hidden;
      /* PERFORMANCE BOOST: Optimize rendering */
      contain: layout style paint;
    }

    /* Recording indicator - pulsing ring */
    .rec-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      position: relative;
    }

    .rec-ring {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #22c55e;
      position: absolute;
      animation: ringPulse 1.5s ease-in-out infinite;
    }

    .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    .overlay.rewrite .rec-ring {
      border-color: #a855f7;
    }

    .overlay.rewrite .rec-dot {
      background: #a855f7;
    }

    .overlay.jarvis .rec-ring {
      border-color: #38bdf8;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
    }

    .overlay.jarvis .rec-dot {
      background: #38bdf8;
    }

    /* Stonic-Grade Agent Telemetry & Personality Auras */
    .overlay.agent-tuktuk .rec-ring {
      border-color: #f43f5e;
      box-shadow: 0 0 14px rgba(244, 63, 94, 0.6);
    }
    .overlay.agent-tuktuk .rec-dot {
      background: #f43f5e;
    }
    .overlay.agent-tuktuk {
      border-color: rgba(244, 63, 94, 0.3);
    }

    .overlay.agent-vision .rec-ring,
    .overlay.agent-andrew .rec-ring {
      border-color: #06b6d4;
      box-shadow: 0 0 14px rgba(6, 182, 212, 0.6);
    }
    .overlay.agent-vision .rec-dot,
    .overlay.agent-andrew .rec-dot {
      background: #06b6d4;
    }
    .overlay.agent-vision,
    .overlay.agent-andrew {
      border-color: rgba(6, 182, 212, 0.3);
    }

    .overlay.agent-jenny .rec-ring {
      border-color: #10b981;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.6);
    }
    .overlay.agent-jenny .rec-dot {
      background: #10b981;
    }
    .overlay.agent-jenny {
      border-color: rgba(16, 185, 129, 0.3);
    }

    .overlay.agent-brian .rec-ring {
      border-color: #f59e0b;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.6);
    }
    .overlay.agent-brian .rec-dot {
      background: #f59e0b;
    }
    .overlay.agent-brian {
      border-color: rgba(245, 158, 11, 0.3);
    }

    /* Thinking / Working / Synthesizing / Transcribing Core Particle Orb Animation */
    .overlay.thinking .rec-ring,
    .overlay.working .rec-ring,
    .overlay.transcribing .rec-ring,
    .overlay.synthesizing .rec-ring {
      animation: thinkingOrb 0.7s ease-in-out infinite alternate;
    }

    .overlay.thinking .rec-dot,
    .overlay.working .rec-dot,
    .overlay.transcribing .rec-dot,
    .overlay.synthesizing .rec-dot {
      animation: dotGlow 0.7s ease-in-out infinite alternate;
    }

    @keyframes thinkingOrb {
      0% { transform: scale(0.9); opacity: 0.6; filter: blur(0.5px); }
      100% { transform: scale(1.4); opacity: 1; filter: blur(0px); }
    }

    @keyframes dotGlow {
      0% { transform: scale(0.85); opacity: 0.7; }
      100% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 5px currentColor); }
    }

    @keyframes ringPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    /* Label text */
    .rec-label {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      white-space: nowrap;
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Waveform - compact inline */
    .waveform {
      height: 20px;
      width: 60px;
      flex-shrink: 0;
    }

    #waveCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Timer badge */
    .timer {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      font-variant-numeric: tabular-nums;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 8px;
      border-radius: 10px;
      flex-shrink: 0;
      text-align: center;
      min-width: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }



    /* Entrance animation */
    .overlay {
      animation: slideIn 0.2s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Exit animation */
    .overlay.fade-out {
      animation: fadeOut 0.2s ease-out forwards;
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      50% { opacity: 0.7; transform: translateY(-4px) scale(0.98); }
      to { opacity: 0; transform: translateY(-8px) scale(0.95); }
    }

    /* Quick popup mode - faster, more dramatic animations */
    .overlay.quick-popup {
      animation: quickPopIn 0.1s ease-out;
    }

    @keyframes quickPopIn {
      0% { 
        opacity: 0; 
        transform: translateY(-8px) scale(0.8); 
      }
      50% { 
        opacity: 1; 
        transform: translateY(2px) scale(1.05); 
      }
      100% { 
        opacity: 1; 
        transform: translateY(0) scale(1); 
      }
    }

    /* Quick popup flash effect */
    .overlay.quick-popup .rec-indicator {
      animation: quickFlash 0.15s ease-in-out infinite;
    }

    @keyframes quickFlash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Quick popup compact styling */
    .overlay.quick-popup {
      height: 35px;
      padding: 0 12px;
      gap: 8px;
    }

    .overlay.quick-popup .rec-label {
      font-size: 12px;
    }

    .overlay.quick-popup .timer {
      font-size: 11px;
      padding: 1px 6px;
      min-width: 35px;
    }

    .overlay.quick-popup .waveform {
      width: 40px;
      height: 16px;
    }
  </style>
</head>

<body>
  <div class="overlay" id="overlay">
    <div class="rec-indicator">
      <div class="rec-ring"></div>
      <div class="rec-dot"></div>
    </div>

    <span class="rec-label">Recording</span>

    <div class="waveform">
      <canvas id="waveCanvas"></canvas>
    </div>

    <div class="timer" id="timer">0:00</div>
  </div>

  <script src="overlay.js"></script>
</body>

</html>
