<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Eloquent Ocular Vision Engine</title>
</head>
<body style="background: transparent; margin: 0; padding: 0; overflow: hidden;">
  <video id="videoElement" autoplay playsinline muted width="320" height="240" style="display: none;"></video>
  <canvas id="canvasElement" width="160" height="120" style="display: none;"></canvas>

  <script>
    const { ipcRenderer } = require("electron");

    const video = document.getElementById("videoElement");
    const canvas = document.getElementById("canvasElement");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    let isStreaming = false;
    let streamTrack = null;
    let processInterval = null;

    // Zero-allocation reusable buffers
    const MOUTH_W = 70, MOUTH_H = 45;
    const EYE_W = 80, EYE_H = 45;
    const FRAME_W = 160, FRAME_H = 120;

    let prevMouthLuma = new Uint8Array(MOUTH_W * MOUTH_H);
    let currMouthLuma = new Uint8Array(MOUTH_W * MOUTH_H);
    let hasPrevMouth = false;

    let prevEyeLuma = new Uint8Array(EYE_W * EYE_H);
    let currEyeLuma = new Uint8Array(EYE_W * EYE_H);
    let hasPrevEye = false;

    async function startCamera() {
      if (isStreaming) return;
      try {
        let stream = null;
        const constraints = [
          { video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } }, audio: false },
          { video: { width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { ideal: 30 } }, audio: false },
          { video: true, audio: false }
        ];

        for (const c of constraints) {
          try {
            stream = await navigator.mediaDevices.getUserMedia(c);
            if (stream) break;
          } catch (e) {
            // Try next constraint
          }
        }

        if (!stream) {
          throw new Error("Unable to acquire camera stream with available video constraints");
        }

        video.srcObject = stream;
        streamTrack = stream.getVideoTracks()[0];
        video.setAttribute("playsinline", "true");
        video.muted = true;
        await video.play();
        isStreaming = true;

        ipcRenderer.send("camera-status-changed", { active: true });

        // Continuous Ocular Eyes: 20 FPS (50ms interval)
        if (processInterval) clearInterval(processInterval);
        processInterval = setInterval(processFrame, 50);
      } catch (err) {
        console.error("Camera access error:", err.message);
        ipcRenderer.send("camera-status-changed", { active: false, error: err.message });
      }
    }

    function stopCamera() {
      if (processInterval) {
        clearInterval(processInterval);
        processInterval = null;
      }
      if (video.srcObject) {
        try {
          const stream = video.srcObject;
          if (stream && typeof stream.getTracks === "function") {
            stream.getTracks().forEach(track => {
              try { track.stop(); } catch (e) {}
            });
          }
        } catch (e) {}
        video.srcObject = null;
      }
      if (streamTrack) {
        try { streamTrack.stop(); } catch (e) {}
        streamTrack = null;
      }
      hasPrevMouth = false;
      hasPrevEye = false;
      isStreaming = false;
      ipcRenderer.send("camera-status-changed", { active: false });
    }

    function processFrame() {
      if (!isStreaming || video.readyState < 2) return;

      try {
        ctx.drawImage(video, 0, 0, FRAME_W, FRAME_H);

        // 1. Mouth Region Analysis (Lower center: x:45-115, y:70-115)
        const mouthImg = ctx.getImageData(45, 70, MOUTH_W, MOUTH_H);
        const mouthData = mouthImg.data;
        let mouthDelta = 0;
        const totalMouthPixels = MOUTH_W * MOUTH_H;

        for (let i = 0, p = 0; i < mouthData.length; i += 4, p++) {
          const lum = (mouthData[i] * 299 + mouthData[i + 1] * 587 + mouthData[i + 2] * 114) / 1000;
          currMouthLuma[p] = lum;
          if (hasPrevMouth) {
            mouthDelta += Math.abs(lum - prevMouthLuma[p]);
          }
        }
        prevMouthLuma.set(currMouthLuma);
        hasPrevMouth = true;

        const avgMouthDelta = mouthDelta / totalMouthPixels;
        const lipMotionEnergy = Math.min(1.0, avgMouthDelta / 12.0);
        const isLipsMoving = lipMotionEnergy > 0.10;

        // 2. Eye & Upper Face Region (Center top: x:40-120, y:20-65)
        const eyeImg = ctx.getImageData(40, 20, EYE_W, EYE_H);
        const eyeData = eyeImg.data;
        let eyeDelta = 0;
        let eyeLuminanceSum = 0;
        const totalEyePixels = EYE_W * EYE_H;

        for (let i = 0, p = 0; i < eyeData.length; i += 4, p++) {
          const lum = (eyeData[i] * 299 + eyeData[i + 1] * 587 + eyeData[i + 2] * 114) / 1000;
          currEyeLuma[p] = lum;
          eyeLuminanceSum += lum;
          if (hasPrevEye) {
            eyeDelta += Math.abs(lum - prevEyeLuma[p]);
          }
        }
        prevEyeLuma.set(currEyeLuma);
        hasPrevEye = true;

        const eyeMotion = eyeDelta / totalEyePixels;
        const avgEyeLuma = eyeLuminanceSum / totalEyePixels;
        const userPresent = avgEyeLuma > 15;
        const isAttentive = userPresent && (eyeMotion < 18.0);

        // 3. Posture & Elevation Analysis
        const fullImg = ctx.getImageData(0, 0, FRAME_W, FRAME_H);
        const fullData = fullImg.data;
        let sumY = 0, count = 0;
        for (let i = 0, p = 0; i < fullData.length; i += 4, p++) {
          const lum = (fullData[i] * 299 + fullData[i + 1] * 587 + fullData[i + 2] * 114) / 1000;
          if (lum > 30) {
            sumY += Math.floor(p / FRAME_W);
            count++;
          }
        }
        const centroidY = count > 0 ? (sumY / count) : (FRAME_H / 2);
        const elevationRatio = 1.0 - (centroidY / FRAME_H);
        let posture = 'sitting';
        if (elevationRatio >= 0.62) {
          posture = 'standing';
        }

        ipcRenderer.send("camera-telemetry", {
          lipMotionEnergy,
          isLipsMoving,
          userPresent,
          isAttentive,
          posture,
          elevationRatio: Math.round(elevationRatio * 100) / 100,
          gaze: isAttentive ? 'focused' : (userPresent ? 'shifting' : 'away'),
          timestamp: Date.now()
        });
      } catch (e) {}
    }

    ipcRenderer.on("capture-snapshot", () => {
      try {
        const snapCanvas = document.createElement("canvas");
        snapCanvas.width = video.videoWidth || 640;
        snapCanvas.height = video.videoHeight || 480;
        const snapCtx = snapCanvas.getContext("2d");
        snapCtx.drawImage(video, 0, 0, snapCanvas.width, snapCanvas.height);
        const dataUrl = snapCanvas.toDataURL("image/jpeg", 0.85);
        ipcRenderer.send("camera-snapshot-captured", { dataUrl });
      } catch (err) {
        ipcRenderer.send("camera-snapshot-captured", { error: err.message });
      }
    });

    ipcRenderer.on("start-camera", startCamera);
    ipcRenderer.on("stop-camera", stopCamera);
  </script>
</body>
</html>
