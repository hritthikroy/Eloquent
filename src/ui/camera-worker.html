<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Eloquent Ocular Vision Engine</title>
</head>
<body style="background: transparent; margin: 0; padding: 0; overflow: hidden;">
  <video id="videoElement" autoplay playsinline muted width="320" height="240" style="display: none;"></video>
  <canvas id="canvasElement" width="320" height="240" style="display: none;"></canvas>

  <script>
    const { ipcRenderer } = require("electron");

    const video = document.getElementById("videoElement");
    const canvas = document.getElementById("canvasElement");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    let isStreaming = false;
    let streamTrack = null;
    let processInterval = null;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 640 },
            height: { ideal: 480 },
            frameRate: { ideal: 30 }
          },
          audio: false
        });

        video.srcObject = stream;
        streamTrack = stream.getVideoTracks()[0];
        await video.play();
        isStreaming = true;

        ipcRenderer.send("camera-status-changed", { active: true });

        // Continuous Ocular Eyes: 20 FPS (~1.5% CPU hardware accelerated)
        processInterval = setInterval(processFrame, 50);
      } catch (err) {
        console.error("Camera access error:", err.message);
        ipcRenderer.send("camera-status-changed", { active: false, error: err.message });
      }
    }

    function stopCamera() {
      if (processInterval) {
        clearInterval(processInterval);
        processInterval = null;
      }
      if (streamTrack) {
        streamTrack.stop();
        streamTrack = null;
      }
      if (video.srcObject) {
        video.srcObject = null;
      }
      isStreaming = false;
      ipcRenderer.send("camera-status-changed", { active: false });
    }

    let prevMouthData = null;
    let prevEyesData = null;

    function processFrame() {
      if (!isStreaming || video.readyState < 2) return;

      try {
        ctx.drawImage(video, 0, 0, 160, 120);

        // 1. Mouth Region (Lower center: x:45-115, y:70-115)
        const mouthW = 70, mouthH = 45;
        const mouthImg = ctx.getImageData(45, 70, mouthW, mouthH);
        const mouthData = mouthImg.data;
        let mouthDelta = 0;
        const mouthPixels = mouthW * mouthH;

        for (let i = 0; i < mouthData.length; i += 4) {
          const lum = 0.299 * mouthData[i] + 0.587 * mouthData[i + 1] + 0.114 * mouthData[i + 2];
          if (prevMouthData) {
            mouthDelta += Math.abs(lum - prevMouthData[i]);
          }
        }
        prevMouthData = new Uint8ClampedArray(mouthData);
        const avgMouthDelta = prevMouthData ? (mouthDelta / mouthPixels) : 0;
        const lipMotionEnergy = Math.min(1.0, avgMouthDelta / 12.0);
        const isLipsMoving = lipMotionEnergy > 0.10;

        // 2. Eye & Upper Face Region (Center top: x:40-120, y:20-65) - Gaze, Blinking & Fatigue
        const eyeW = 80, eyeH = 45;
        const eyeImg = ctx.getImageData(40, 20, eyeW, eyeH);
        const eyeData = eyeImg.data;
        let eyeDelta = 0;
        let eyeLuminanceSum = 0;
        const eyePixels = eyeW * eyeH;

        for (let i = 0; i < eyeData.length; i += 4) {
          const lum = 0.299 * eyeData[i] + 0.587 * eyeData[i + 1] + 0.114 * eyeData[i + 2];
          eyeLuminanceSum += lum;
          if (prevEyesData) {
            eyeDelta += Math.abs(lum - prevEyesData[i]);
          }
        }
        prevEyesData = new Uint8ClampedArray(eyeData);
        const eyeMotion = eyeDelta / (eyeW * eyeH);

        // User is directly facing camera and present if luminance variance exists
        const userPresent = (eyeLuminanceSum / (eyeW * eyeH)) > 15;
        const isAttentive = userPresent && (eyeMotion < 18.0); // Stable gaze focused at monitor

        ipcRenderer.send("camera-telemetry", {
          lipMotionEnergy,
          isLipsMoving,
          userPresent,
          isAttentive,
          timestamp: Date.now()
        });
      } catch (e) {}
    }

    ipcRenderer.on("capture-snapshot", () => {
      try {
        const snapCanvas = document.createElement("canvas");
        snapCanvas.width = video.videoWidth || 640;
        snapCanvas.height = video.videoHeight || 480;
        const snapCtx = snapCanvas.getContext("2d");
        snapCtx.drawImage(video, 0, 0, snapCanvas.width, snapCanvas.height);
        const dataUrl = snapCanvas.toDataURL("image/jpeg", 0.85);
        ipcRenderer.send("camera-snapshot-captured", { dataUrl });
      } catch (err) {
        ipcRenderer.send("camera-snapshot-captured", { error: err.message });
      }
    });

    ipcRenderer.on("start-camera", startCamera);
    ipcRenderer.on("stop-camera", stopCamera);

    startCamera();
  </script>
</body>
</html>
