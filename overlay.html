<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>2070 Cyber HUD Recording</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', monospace, sans-serif;
      -webkit-app-region: drag;
      user-select: none;
      overflow: hidden;
      background: transparent;
    }

    /* 2070 Cyberpunk HUD Recording Overlay */
    .overlay {
      width: 286px;
      height: 64px;
      background: linear-gradient(135deg, rgba(8, 12, 22, 0.96), rgba(13, 20, 36, 0.98));
      backdrop-filter: blur(40px) saturate(220%);
      -webkit-backdrop-filter: blur(40px) saturate(220%);
      border-radius: 12px;
      border: 1px solid rgba(0, 240, 255, 0.35);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.8),
        0 0 16px rgba(0, 240, 255, 0.25),
        inset 0 1px 0 rgba(0, 240, 255, 0.4),
        inset 0 -1px 0 rgba(255, 0, 85, 0.25);
      display: flex;
      flex-direction: column;
      padding: 8px 12px;
      gap: 5px;
      position: relative;
      overflow: hidden;
    }

    /* Animated 2070 Laser Scanline Border */
    .overlay::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, #00f0ff, #ff0055, #00ff9f, #00f0ff);
      background-size: 300% 100%;
      animation: cyberGradient 3s linear infinite;
    }

    @keyframes cyberGradient {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    /* Top Row */
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 16px;
    }

    .hud-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 2070 Cyber Status Badge */
    .cyber-tag {
      font-size: 8px;
      font-weight: 800;
      color: #00f0ff;
      background: rgba(0, 240, 255, 0.12);
      border: 0.5px solid rgba(0, 240, 255, 0.4);
      padding: 1px 5px;
      border-radius: 3px;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 0 6px rgba(0, 240, 255, 0.3);
    }

    .cyber-tag::before {
      content: '';
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #00ff9f;
      box-shadow: 0 0 6px #00ff9f;
      animation: pulseDot 1.2s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Mode Badge */
    .mode-badge {
      background: linear-gradient(135deg, #ff0055, #a855f7);
      color: white;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 8px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.6);
      display: none;
    }

    /* 2070 Digital Timer */
    .timer {
      font-family: 'JetBrains Mono', 'SF Mono', monospace;
      font-size: 11px;
      color: #00f0ff;
      text-shadow: 0 0 6px rgba(0, 240, 255, 0.6);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
    }

    /* Close Button */
    .close-btn {
      -webkit-app-region: no-drag;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255, 0, 85, 0.15);
      border: 1px solid rgba(255, 0, 85, 0.4);
      color: #ff0055;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: rgba(255, 0, 85, 0.35);
      box-shadow: 0 0 8px rgba(255, 0, 85, 0.8);
      transform: scale(1.1);
    }

    /* Waveform Canvas */
    #waveformCanvas {
      width: 100%;
      height: 22px;
      border-radius: 4px;
      filter: drop-shadow(0 0 4px rgba(0, 240, 255, 0.4));
    }

    /* Time Left Row */
    .time-left-row {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 10px;
    }

    .time-left-label {
      font-size: 7px;
      color: rgba(0, 240, 255, 0.7);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .time-left-bar-container {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .time-left-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f0ff, #00ff9f);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
      transition: width 0.3s ease;
    }

    .time-left-text {
      font-family: monospace;
      font-size: 8px;
      color: #00f0ff;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="overlay">
    <!-- Top Row -->
    <div class="top-row">
      <div class="hud-left">
        <div class="cyber-tag">2070 HUD</div>
        <div class="mode-badge" id="modeBadge">AI</div>
      </div>
      <div class="timer" id="timer">0:00</div>
      <button class="close-btn" onclick="cancel()" title="Cancel [Esc]">✕</button>
    </div>

    <!-- Waveform Canvas -->
    <canvas id="waveformCanvas"></canvas>

    <!-- Time Left Row -->
    <div class="time-left-row">
      <div class="time-left-label">TELEMETRY</div>
      <div class="time-left-bar-container">
        <div class="time-left-bar" id="timeLeftBar"></div>
      </div>
      <div class="time-left-text" id="timeLeftText">...</div>
    </div>
  </div>

  <script src="utils.js"></script>
  <script>
    const { ipcRenderer } = require('electron');
    const canvas = document.getElementById('waveformCanvas');
    const ctx = canvas.getContext('2d');
    const modeBadge = document.getElementById('modeBadge');
    const timer = document.getElementById('timer');
    const timeLeftBar = document.getElementById('timeLeftBar');
    const timeLeftText = document.getElementById('timeLeftText');

    const dpr = window.devicePixelRatio || 1;
    canvas.width = 256 * dpr;
    canvas.height = 22 * dpr;
    canvas.style.width = '256px';
    canvas.style.height = '22px';
    ctx.scale(dpr, dpr);

    let mode = 'standard';
    let audioContext;
    let analyser;
    let dataArray;
    let animationId;
    let startTime = Date.now();
    let maxRecordingTime = 2400;
    let usedTime = 0;

    function loadRealValues() {
      try {
        const today = new Date().toISOString().split('T')[0];
        const stats = JSON.parse(localStorage.getItem('recordingStats') || '{}');
        if (stats.date === today) {
          usedTime = (stats.standardTime || 0) + (stats.rewriteTime || 0);
        } else {
          usedTime = 0;
        }
        updateTimeLeft();
      } catch (err) {
        usedTime = 0;
        updateTimeLeft();
      }
    }

    async function initAudio() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new AudioContext();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 64;
        analyser.smoothingTimeConstant = 0.85;
        source.connect(analyser);

        dataArray = new Uint8Array(analyser.frequencyBinCount);
        drawWaveform();
      } catch (err) {
        drawFakeWaveform();
      }
    }

    function drawBars(values) {
      ctx.clearRect(0, 0, 256, 22);
      const barCount = 40;
      const barWidth = 3;
      const gap = 2.5;
      const centerY = 11;

      for (let i = 0; i < barCount; i++) {
        const barHeight = Math.max(values[i], 2);
        const gradient = ctx.createLinearGradient(0, centerY - barHeight / 2, 0, centerY + barHeight / 2);
        if (mode === 'rewrite') {
          gradient.addColorStop(0, '#ff0055');
          gradient.addColorStop(1, '#a855f7');
        } else {
          gradient.addColorStop(0, '#00f0ff');
          gradient.addColorStop(1, '#00ff9f');
        }

        ctx.fillStyle = gradient;
        ctx.shadowBlur = 4;
        ctx.shadowColor = mode === 'rewrite' ? '#ff0055' : '#00f0ff';
        ctx.fillRect(i * (barWidth + gap), centerY - barHeight / 2, barWidth, barHeight);
      }
      updateTimer();
    }

    function drawWaveform() {
      animationId = requestAnimationFrame(drawWaveform);
      analyser.getByteFrequencyData(dataArray);

      const values = [];
      for (let i = 0; i < 40; i++) {
        const dataIndex = Math.floor(i * dataArray.length / 40);
        const value = dataArray[dataIndex] / 255;
        values.push(value * 18);
      }
      drawBars(values);
    }

    function drawFakeWaveform() {
      let frame = 0;
      function animate() {
        animationId = requestAnimationFrame(animate);
        const values = [];
        for (let i = 0; i < 40; i++) {
          const value = (Math.sin(frame * 0.05 + i * 0.3) * 0.5 + 0.5) * 0.6;
          values.push(value * 16);
        }
        drawBars(values);
        frame++;
      }
      animate();
    }

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const mins = Math.floor(elapsed / 60);
      const secs = elapsed % 60;
      timer.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
      updateTimeLeft();
    }

    function updateTimeLeft() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const currentUsed = usedTime + elapsed;
      const remaining = maxRecordingTime - currentUsed;
      const percentage = (currentUsed / maxRecordingTime) * 100;

      timeLeftBar.style.width = Math.min(percentage, 100) + '%';
      timeLeftText.textContent = `${currentUsed}/${maxRecordingTime}s`;

      if (remaining < 60) {
        timeLeftBar.style.background = 'linear-gradient(90deg, #ff0055, #cc0000)';
        timeLeftBar.style.boxShadow = '0 0 8px rgba(255, 0, 85, 0.8)';
        timeLeftText.style.color = '#ff0055';
      } else if (remaining < 300) {
        timeLeftBar.style.background = 'linear-gradient(90deg, #ffb703, #ff8800)';
        timeLeftBar.style.boxShadow = '0 0 8px rgba(255, 183, 3, 0.8)';
        timeLeftText.style.color = '#ffb703';
      }
    }

    ipcRenderer.on('set-mode', (_, m) => {
      mode = m;
      if (mode === 'rewrite') {
        modeBadge.style.display = 'block';
      }
    });

    function cancel() {
      if (audioContext) audioContext.close();
      if (animationId) cancelAnimationFrame(animationId);
      window.close();
    }

    loadRealValues();
    initAudio();

    window.addEventListener('beforeunload', () => {
      if (audioContext) audioContext.close();
      if (animationId) cancelAnimationFrame(animationId);
    });
  </script>
</body>

</html>
